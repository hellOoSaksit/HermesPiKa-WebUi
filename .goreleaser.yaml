version: 2

project_name: hpk

builds:
  - id: hpk
    main: ./cmd/hpk
    binary: hpk
    env:
      - CGO_ENABLED=0 # pure Go, so every target cross-compiles without a C toolchain
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X hpk.local/hpk/internal/version.Version={{.Version}}
      - -X hpk.local/hpk/internal/version.Commit={{.ShortCommit}}
      - -X hpk.local/hpk/internal/version.Date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md, docs/*.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

release:
  draft: true # a person reviews and publishes
  prerelease: auto
  footer: |
    Source-available under MIT + Commons Clause: use, change and share it; do not sell it. See LICENSE.
    Verify a download: sha256sum -c checksums.txt
