version: 2

project_name: hpk

builds:
  - id: hpk
    main: ./cmd/hpk
    binary: hpk
    env:
      - CGO_ENABLED=0 # pure Go, so every target cross-compiles without a C toolchain
    # No Windows binary: antivirus flags unsigned Windows builds of hpk
    # (self-install, PATH, start at login) as malware. Windows runs hpk in
    # Docker instead: install.ps1 sets it up (docs/install.md).
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X hpk.local/hpk/internal/version.Version={{.Version}}
      - -X hpk.local/hpk/internal/version.Commit={{.ShortCommit}}
      - -X hpk.local/hpk/internal/version.Date={{.Date}}

archives:
  - id: hpk
    ids: [hpk]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md, CHANGELOG.md, docs/*.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files: # the install scripts are checked by the same checksums.txt
    - glob: install.sh
    - glob: install.ps1
    - glob: docker/compose.release.yaml
      name_template: compose.release.yaml

sboms:
  - artifacts: archive

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

release:
  draft: true # a person reviews and publishes
  prerelease: auto
  extra_files: # users fetch these from releases/latest/download/
    - glob: install.sh
    - glob: install.ps1
    - glob: docker/compose.release.yaml
      name_template: compose.release.yaml
  footer: |
    Source-available under MIT + Commons Clause: use, change and share it; do not sell it. See LICENSE.
    Verify a download: sha256sum --ignore-missing -c checksums.txt
