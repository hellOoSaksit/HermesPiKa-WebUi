#
# Hermes Agent + hpk from the released image, for one person on one computer.
# No build, no proxy: the Console is on http://127.0.0.1:7878, reachable from this
# computer only (plain HTTP on loopback).
#
#   docker compose -f compose.release.yaml up -d
#   docker compose -f compose.release.yaml exec hermes cat /opt/data/hpk/owner-token   # once, then delete it
#   open http://127.0.0.1:7878 and paste the token
#
# Change HPK_OWNER below to your email before the first start. For a server, use
# docker/hermes/compose.yaml behind a TLS proxy instead (docs/docker.md).
name: hpk-hermes
services:
  hermes:
    image: ghcr.io/hellooosaksit/hpk-hermes:0.1.0
    environment:
      HPK_OWNER: you@example.com # first start only
      HPK_BEHIND_PROXY: "1" # serve plain HTTP; safe here because the port is loopback-only
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - hermes-data:/opt/data # Hermes home: config, sessions, hpk projects and wikis
    ports:
      - "127.0.0.1:7878:7878"
    restart: unless-stopped

volumes:
  hermes-data:
