# Hermes Agent + hpk in one container (docs/docker.md).
#
#   CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../../dist/docker/hpk-linux-amd64 ../../cmd/hpk
#   docker compose up -d --build
#   docker compose exec hermes cat /opt/data/hpk/owner-token        # once, then delete it
#   docker compose exec -u hermes hermes hermes auth add <provider>  # Hermes needs a model account
#
# The Hermes gateway (messaging, cron) is the main process; HPK Console runs beside
# it. Put your TLS proxy in front, or give hpk a certificate (HPK_TLS_CERT/KEY).
services:
  hermes:
    image: hpk-hermes:local
    build:
      context: ../..
      dockerfile: docker/hermes/Dockerfile
    environment:
      HPK_OWNER: owner@example.com # first start only
      HPK_BEHIND_PROXY: "1"
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - hermes-data:/opt/data # Hermes home: config, sessions, hpk projects and wikis
    expose:
      - "7878"
    restart: unless-stopped

volumes:
  hermes-data:
